# 本地开发（默认环境）：连接本机 MySQL。仓库里只放占位符，不放任何账号密码。
# 账号密码二选一提供：
#   1. 环境变量 DB_USERNAME / DB_PASSWORD（以及可选的 DB_HOST / DB_PORT / DB_NAME 或完整的 DB_URL）
#   2. 在本目录新建 application-secret.yml（已被 .gitignore 和 .dockerignore 排除），覆盖下面任意配置
spring:
  config:
    import: optional:classpath:application-secret.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tourism}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
  h2:
    console:
      enabled: false
logging:
  level:
    com.zkt.backend: INFO
