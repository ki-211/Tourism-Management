spring:
  application:
    name: tourism-backend
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Shanghai
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: PT15M
    refresh-ttl: P30D
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://localhost:5173}
  storage:
    type: ${STORAGE_TYPE:local}
    local-root: ${LOCAL_STORAGE_ROOT:./.local/uploads}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    s3-endpoint: ${S3_ENDPOINT:}
    s3-region: ${S3_REGION:us-east-1}
    s3-bucket: ${S3_BUCKET:tourism}
    s3-access-key: ${S3_ACCESS_KEY:}
    s3-secret-key: ${S3_SECRET_KEY:}
    s3-path-style: ${S3_PATH_STYLE:true}
  amap-web-key: ${AMAP_WEB_KEY:}

management:
  endpoints.web.exposure.include: health,info
springdoc:
  swagger-ui.path: /swagger-ui.html
