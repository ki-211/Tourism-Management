spring:
  application:
    name: tourism-backend
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  http:
    client:
      factory: simple
      connect-timeout: 3s
      read-timeout: 5s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Shanghai
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  time-zone: ${APP_TIME_ZONE:Asia/Shanghai}
  realtime:
    mode: ${REALTIME_MODE:local}
    channel: ${REALTIME_CHANNEL:tourism:room-events}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${AUTH_RATE_LIMIT:60}
    upload-per-minute: ${UPLOAD_RATE_LIMIT:60}
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: PT15M
    refresh-ttl: P30D
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://localhost:5173}
  storage:
    type: ${STORAGE_TYPE:local}
    local-root: ${LOCAL_STORAGE_ROOT:./.local/uploads}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    s3-endpoint: ${S3_ENDPOINT:}
    s3-region: ${S3_REGION:us-east-1}
    s3-bucket: ${S3_BUCKET:tourism}
    s3-access-key: ${S3_ACCESS_KEY:}
    s3-secret-key: ${S3_SECRET_KEY:}
    s3-path-style: ${S3_PATH_STYLE:true}
  amap-web-key: ${AMAP_WEB_KEY:}

management:
  health:
    redis.enabled: ${REDIS_HEALTH_ENABLED:false}
  endpoints.web.exposure.include: health,info
  endpoint:
    health:
      probes.enabled: true
springdoc:
  swagger-ui.path: /swagger-ui.html
