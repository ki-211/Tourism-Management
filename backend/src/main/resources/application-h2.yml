# 零依赖本地环境：H2 文件数据库，无需安装 MySQL。
# 启用方式：--spring.profiles.active=h2（或 -Dspring-boot.run.profiles=h2）。
# 数据文件位于启动工作目录下的 .local/tourism.mv.db，切换数据库不会迁移已有数据。
spring:
  datasource:
    url: jdbc:h2:file:./.local/tourism;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
logging:
  level:
    com.zkt.backend: INFO
