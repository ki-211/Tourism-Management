services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tourism}
      MYSQL_USER: ${DB_USERNAME:-tourism}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -p${DB_ROOT_PASSWORD}]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [minio-data:/data]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-tourism}
      DB_USERNAME: ${DB_USERNAME:-tourism}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      STORAGE_TYPE: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-tourism}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}

  frontend:
    build:
      context: ./frontend
      args: { VITE_API_BASE_URL: /api/v1 }
    restart: unless-stopped
    depends_on: [backend]
    ports: ["${HTTP_PORT:-80}:80"]

volumes:
  mysql-data:
  minio-data:
